services:
  mysql:
    image: mysql:8.0
    container_name: apqp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: apqp_root_2026
      MYSQL_DATABASE: apqp_system
      MYSQL_USER: apqp_user
      MYSQL_PASSWORD: apqp_pass_2026
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: apqp-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: apqp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: apqp_minio
      MINIO_ROOT_PASSWORD: apqp_minio_2026
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  redis_data:
  minio_data:
